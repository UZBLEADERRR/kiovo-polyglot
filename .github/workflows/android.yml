name: APK yig'ish

on:
  push:
    branches:
      - claude/short-video-creation-platform-nr4gp7
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bog'liqliklarni o'rnatish
        run: npm ci

      - name: Web ilovani yig'ish
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor sinxronizatsiyasi
        run: npx cap sync android

      - name: Gradle keshini tiklash
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Imzo kalitini tayyorlash
        id: keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Debug APK
        working-directory: android
        env:
          KIOVO_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Release APK
        working-directory: android
        env:
          KIOVO_VERSION_CODE: ${{ github.run_number }}
          KIOVO_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KIOVO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KIOVO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KIOVO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Fayllarni nomlash
        id: apk
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/kiovo-reels-debug.apk
          cp android/app/build/outputs/apk/release/app-release*.apk artifacts/kiovo-reels-release.apk
          ls -la artifacts

      - name: APK'ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: kiovo-reels-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Relizga biriktirish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
